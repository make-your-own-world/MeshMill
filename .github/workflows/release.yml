name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.0"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    env:
      CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$') {
            throw "Invalid release version: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check release privacy
        run: python tools/release_privacy_check.py

      - name: Generate version metadata
        run: python tools/write_version_info.py --version "${{ steps.version.outputs.version }}"

      - name: Build self-contained application
        run: python -m PyInstaller --noconfirm --clean MeshMill.spec

      - name: Sign application executables
        if: ${{ env.CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "meshmill-signing.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $signtool) { throw "signtool.exe was not found" }
          Get-ChildItem "dist\MeshMill\*.exe" | ForEach-Object {
            & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certificate /p $env:CERTIFICATE_PASSWORD $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signing failed: $($_.Name)" }
          }
          [IO.File]::Delete($certificate)

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.version }}" "installer\MeshMill.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }

      - name: Sign installer
        if: ${{ env.CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "meshmill-signing.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending | Select-Object -First 1).FullName
          $installer = Get-Item "release\MeshMill-${{ steps.version.outputs.version }}-windows-x64-setup.exe"
          & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certificate /p $env:CERTIFICATE_PASSWORD $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "Installer signing failed" }
          [IO.File]::Delete($certificate)

      - name: Build portable archive and checksums
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Compress-Archive -LiteralPath "dist\MeshMill" -DestinationPath "release\MeshMill-$version-windows-x64-portable.zip" -CompressionLevel Optimal
          Copy-Item -LiteralPath "samples\original-scan.stl" -Destination "release\MeshMill-sample-scan-original.stl"
          Get-ChildItem release -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content "release\SHA256SUMS.txt" -Encoding ascii

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MeshMill-${{ steps.version.outputs.version }}-windows-x64
          path: release/*
          if-no-files-found: error

      - name: Publish tagged GitHub Release
        if: ${{ github.event_name == 'push' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release/* --verify-tag --generate-notes --title "MeshMill ${{ steps.version.outputs.version }}"
