name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile source
        run: python -m py_compile meshmill.py
      - name: Validate English source catalog
        run: python tools/localization/validate_locales.py --source-only
      - name: Test density processing
        run: python tools/test_density.py
      - name: Test shortcut routing
        run: python tests/test_shortcut_routing.py
      - name: Test export, automation, and worker lifecycle
        run: python -m pytest tests/test_mesh_export.py tests/test_calibrated_export.py tests/test_workflow_scripts.py tests/test_new_geometry/test_solid_surface_prepare.py tests/test_worker_lifecycle.py tests/test_release_notes.py -q
      - name: Check command-line entry point
        run: python meshmill.py --cli --help
      - name: Smoke-test the sample mesh
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "meshmill-smoke.stl"
          python meshmill.py --cli "samples/sample-scan.stl" --target 10000 --output $output
          if (-not (Test-Path -LiteralPath $output)) { throw "CLI did not create an output STL" }
