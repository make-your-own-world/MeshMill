[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "meshmill"
version = "0.2.0"
description = "A local desktop and command-line tool for inspecting and optimizing STL meshes."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [{ name = "MeshMill contributors" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Manufacturing",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
  "fast-simplification==0.2.0",
  "cupy-cuda12x==13.6.0; platform_system == 'Windows'",
  "nvidia-cuda-nvrtc-cu12==12.0.140; platform_system == 'Windows'",
  "numpy==2.5.3",
  "PySide6==6.11.2",
  "vtk==9.7.1",
]

[project.scripts]
meshmill = "meshmill:main"

[tool.setuptools]
py-modules = ["meshmill", "out_of_core", "gpu_resident", "depth_adaptive_qem"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
