[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "meshmill"
version = "0.4.0"
description = "A local desktop and command-line tool for inspecting, reducing, repairing, and exporting mesh geometry."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [{ name = "MeshMill contributors" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Manufacturing",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
  "fast-simplification==0.2.0",
  "cupy-cuda12x==13.6.0; platform_system == 'Windows'",
  "nvidia-cuda-nvrtc-cu12==12.0.140; platform_system == 'Windows'",
  "numpy==2.5.3",
  "PySide6==6.11.2",
  "vtk==9.7.1",
  "pymeshfix==0.18.1",
  "tetgen==0.8.4",
  "PyMaxflow==1.3.2",
  "python-sat==1.9.dev17",
  "warp-lang==1.9.1",
]

[project.scripts]
meshmill = "meshmill:main"

[tool.setuptools]
py-modules = ["axis_datum", "lathe_axis", "lathe_contact", "lathe_control", "lathe_spindle", "orientation_layout", "clamshell_mold", "closed_reduction", "constrained_solid", "depth_adaptive_qem", "exposed_surface", "geometry_dimension_control", "geometry_workload", "gpu_resident", "imprint_cleanup", "imprint_gpu", "localization", "mesh_export", "mesh_export_ui", "mesh_formats", "mesh_workflow", "meshmill", "meshmill_version", "metrics_history", "out_of_core", "partial_scan_cavity", "qem_progress", "solidify", "solid_surface_prepare", "solidify_metrics", "surface_distance_gpu", "surface_repair", "surface_sheets", "surface_support_repair", "wall_thickness", "worker_lifecycle"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
